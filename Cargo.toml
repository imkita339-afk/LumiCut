[package]
name = "lumicut"
version = "0.1.0"
edition = "2021"
description = "LumiCut — видеоредактор"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
